name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Route against the exact PR head and its complete branch history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci_scope.py
  core:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Scoped checks qualify the frozen PR head; full checks retain the
          # existing pull-request merge checkout for unrelated changes.
          ref: ${{ needs.scope.outputs.mode == 'sequence' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' 'filelock>=3.20,<4' 'platformdirs>=4,<5'
      - name: Synthetic sealed-sequence checks (no model fitting)
        if: needs.scope.outputs.mode == 'sequence'
        run: >-
          python -m pytest -q
          tests/test_sequence_pipeline.py
          tests/test_ci_scope.py
          tests/test_priority.py
          tests/test_review_budget_audit.py
          tests/test_public_source_boundary.py
      - name: Public source privacy gate
        if: needs.scope.outputs.mode == 'sequence'
        run: python scripts/verify_public_source_boundary.py
      - name: Full existing test suite
        if: needs.scope.outputs.mode == 'full'
        run: python -m pytest -q
  local-model:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3' 'torchvision>=0.21,<1'
      - run: python -m pip install -e '.[dev,ml,spatial]'
      - name: Install executor isolation dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Required executor security canaries and isolated generated smoke
        env:
          CAPSULE_REQUIRE_ISOLATION: '1'
        run: python -m pytest -q tests/test_spatial_executor_security.py
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py --with-test-model
      - run: python tests/browser_blinded_review_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-viewer-screenshots
          path: |
            test-results/browser/viewer-desktop.png
            test-results/browser/viewer-mobile.png
            test-results/browser/synthetic-queue-demo.png
            test-results/browser/synthetic-policy-comparison.png
          if-no-files-found: error
