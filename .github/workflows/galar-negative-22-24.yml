name: Galar 22+24 blood-negative fitting original-PNG source acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fitting-negative-22-24-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire-source:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing engineering tests and approved 7z extractor
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
      - name: Verify frozen acquisition spec, protected cohorts and source integrity tests
        run: |
          test "$(git hash-object docs/GALAR_NEGATIVE_22_24_ACQUISITION_SPEC.json)" = "590d5c11d5536dd4368e31cfea16af53b191941c"
          python -m pytest -q \
            tests/test_acquire_galar_negative_22_24.py \
            tests/test_probe_galar_archive.py \
            tests/test_summarize_galar_archive_layout.py \
            tests/test_plan_galar_fitting_images.py
      - name: Download and hash only official corrected source annotation ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from capsule_review.data_download import get_catalog, download_file
          catalog=get_catalog(Path('/tmp/galar-negative-source-catalog.json'))
          receipt=download_file(catalog,60383963,Path('/tmp/galar-negative-source-labels'),max_bytes=20_000_000)
          assert receipt['sha256']=='2f5ba84c47d343d51952e78bf22183b9d04ba8c105f625af3cf9ffb20412e52f'
          print('Verified Galar corrected label archive; no protected CSV read')
          PY
      - name: Reproduce exactly the original frozen fitting source-image plan
        run: |
          python scripts/plan_galar_fitting_images.py \
            --labels-zip /tmp/galar-negative-source-labels/20251215_Labels_Updated.zip \
            --output-dir /tmp/galar-negative-frozen-plan --images-per-exam 512
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          expected=json.loads(Path('experiments/galar-21-30-selection/aggregate.json').read_text())
          actual=json.loads(Path('/tmp/galar-negative-frozen-plan/aggregate.json').read_text())
          assert actual==expected
          assert actual['private_request_sha256']=='1aedfcdecbb270687a660acd50f312803ed0884308ea9a0973102aac242409f1'
          for exam,total in [(22,7529),(24,13418)]:
              d=actual['per_examination'][str(exam)]
              assert d['annotation_rows']==total
              assert d['unique_requested_images']==512
              assert d['label_blind_reference_candidates']==512
              assert d['enriched_training_candidates']==512
              assert d['dual_purpose_overlap']==512
              assert d['blood_positive_source_rows']==0
          print('Reproduced immutable 512 label-blind fitting selections on both negative source exams')
          PY
      - name: Download only three previously hashed source blocks; verify 1,024 original images
        run: |
          python scripts/acquire_galar_negative_22_24.py \
            --spec docs/GALAR_NEGATIVE_22_24_ACQUISITION_SPEC.json \
            --layout experiments/galar-21-30-source-index/layout.json \
            --source-blocks experiments/galar27-2026-11-02/source-block-coverage.json \
            --selection /tmp/galar-negative-frozen-plan/requested_frames.csv \
            --workdir /tmp/galar-negative-source-verified-staging \
            --package /tmp/galar-negative-22-24-original-png-private.zip
      - name: Preserve original PNGs and private manifest only in temporary private artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar-negative-22-24-verified-original-pngs-private
          path: |
            /tmp/galar-negative-22-24-original-png-private.zip
            /tmp/galar-negative-source-verified-staging/aggregate-receipt.json
          retention-days: 30
          if-no-files-found: error
