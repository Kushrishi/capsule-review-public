name: Galar23 verified original-PNG density experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-pixel-study:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen protocol, source guards and selection tests
        run: |
          test "$(git hash-object docs/GALAR23_PIXEL_DENSITY_SPEC.json)" = "1eb7c7e6ee9578800de2c15bcfec9ba520a63e97"
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_galar23_pixel_density.py tests/test_galar_density_ceiling.py tests/test_acquire_galar_block0.py tests/test_probe_galar_archive.py
      - name: Install the original 7z source decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
      - name: Download and checksum only official corrected Galar labels
        run: |
          python - <<'PY'
          from pathlib import Path
          from capsule_review.data_download import get_catalog, download_file
          catalog=get_catalog(Path('/tmp/galar23-pixel-source-catalog.json'))
          record=download_file(catalog,60383963,Path('/tmp/galar23-pixel-label-source'),max_bytes=20_000_000)
          assert record['sha256']=='2f5ba84c47d343d51952e78bf22183b9d04ba8c105f625af3cf9ffb20412e52f'
          print('Original corrected label archive hash verified, no reserved CSV opened.')
          PY
      - name: Verify exact source block, decode only 4,608 allowed original images, compare frozen selection
        run: |
          python scripts/galar23_pixel_density.py \
            --labels-zip /tmp/galar23-pixel-label-source/20251215_Labels_Updated.zip \
            --layout experiments/galar-21-30-source-index/layout.json \
            --spec docs/GALAR23_PIXEL_DENSITY_SPEC.json \
            --workdir /tmp/galar23-pixel-research-staging \
            --out /tmp/galar23-pixel-results/aggregate.json
      - name: Preserve only nonidentifying image-result aggregate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar23-pixel-density-aggregate-only
          path: /tmp/galar23-pixel-results/aggregate.json
          if-no-files-found: error
          retention-days: 30
