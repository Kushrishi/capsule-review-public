name: Galar verified first-block extraction after metadata fix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galar-block0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire-verified-exam21:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source/test dependencies and exact 7z decoder
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
      - name: Verify all one-block safety, dataset-role and export tests
        run: |
          python -m pytest -q tests/test_probe_galar_archive.py tests/test_summarize_galar_archive_layout.py tests/test_plan_galar_fitting_images.py tests/test_acquire_galar_block0.py
      - name: Download and verify ONLY official corrected 17.93-MB labels
        run: |
          python - <<'PY'
          from pathlib import Path
          from capsule_review.data_download import get_catalog, download_file
          metadata=get_catalog(Path('/tmp/galar-official-catalog.json'))
          receipt=download_file(metadata,60383963,Path('/tmp/galar-labels'),max_bytes=20_000_000)
          assert receipt['sha256']=='2f5ba84c47d343d51952e78bf22183b9d04ba8c105f625af3cf9ffb20412e52f'
          print('Original official corrected label ZIP source SHA-256 verified.')
          PY
      - name: Reproduce fixed fitting-only selection locally; forbid holdout access
        run: |
          python scripts/plan_galar_fitting_images.py \
            --labels-zip /tmp/galar-labels/20251215_Labels_Updated.zip \
            --output-dir /tmp/galar-selection --images-per-exam 512
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/galar-selection/aggregate.json').read_text())
          b=json.loads(Path('experiments/galar-21-30-selection/aggregate.json').read_text())
          assert a==b and a['overall']['unique_frames_requested']==8075
          print('Private source-frame request digest and public aggregate exactly reproduced.')
          PY
      - name: Retrieve ONLY official solid block zero (3.474 GB), validate PNGs and package
        run: |
          python scripts/acquire_galar_block0.py \
            --index-layout experiments/galar-21-30-source-index/layout.json \
            --private-selection /tmp/galar-selection/requested_frames.csv \
            --workdir /tmp/galar-block0-work \
            --source-package /tmp/galar-exam21-verified-source.zip
      - name: Retain only selected original images and verified private provenance
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar-exam21-verified-frames-private
          path: |
            /tmp/galar-exam21-verified-source.zip
            /tmp/galar-block0-work/aggregate-receipt.json
          retention-days: 30
          if-no-files-found: error