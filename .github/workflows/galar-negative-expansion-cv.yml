name: Galar 22/24 fixed pooled-CNN expansion research checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/galar-negative-expansion-cv.yml'
      - 'docs/GALAR_NEGATIVE_EXPANSION_CV_SPEC.json'
      - 'docs/GALAR_NEGATIVE_EXPANSION_CV_RESULTS.md'
      - 'scripts/galar_negative_expansion_cv.py'
      - 'scripts/compare_galar_negative_expansion.py'
      - 'scripts/verify_galar_negative_expansion_cv.py'
      - 'scripts/verify_galar_negative_expansion_pixels.py'
      - 'tests/test_galar_negative_expansion_record.py'
      - 'tests/test_galar_negative_expansion_training.py'
      - 'experiments/galar-negative-expansion-cv-2026-11-02/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-source-and-synthetic-training:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install numerical research dependencies without acquiring medical images
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          python -m pip install -e '.[dev,ml]' 'scikit-learn>=1.6,<2'
      - name: Verify original immutable protocol and exact published research outputs
        run: |
          test "$(git hash-object docs/GALAR_NEGATIVE_EXPANSION_CV_SPEC.json)" = "aa15f1ffaba381bb663a2ef3f0e1c578b4fd56c9"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'aggregate.json':'65bec25557b00f0461c490374a3a1c9a0123b215b7f750c0648e3b30537bd471',
            'paired_comparison.json':'1cb2d8d26739a39d4a10339ec2aafedff16bce5c67b79e00b635f2ef91bb349b',
            'verification.json':'455392eafa17452c662d57a1e60382d26da68284c212c883a0fd5d0a46a5eca6',
            'source_pixel_spotcheck.json':'8e0b63deb545639d7acb8890ab321363ba33c197a14ebf82152c77f37b28310d',
          }
          root=Path('experiments/galar-negative-expansion-cv-2026-11-02')
          for name,digest in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          print('Frozen specification and original nonidentifying outputs byte-identical.')
          PY
      - name: Check training-source isolation and image-free synthetic model behavior
        run: |
          python -m pytest -q tests/test_galar_negative_expansion_record.py tests/test_galar_negative_expansion_training.py
          python -m py_compile scripts/galar_negative_expansion_cv.py scripts/compare_galar_negative_expansion.py scripts/verify_galar_negative_expansion_cv.py scripts/verify_galar_negative_expansion_pixels.py
