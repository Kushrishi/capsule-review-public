name: Red Lesion source index gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-only:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify bounded probe logic
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_probe_red_lesion.py tests/test_ranged_zip.py
      - name: Index-only official Red Lesion source probe (4 MiB hard cap)
        run: python scripts/probe_red_lesion.py --output source-evidence/red-lesion-index.json
      - name: Save source evidence even when official host rejects Range
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: red-lesion-source-index-only
          path: source-evidence/red-lesion-index.json
          if-no-files-found: error
          retention-days: 14
