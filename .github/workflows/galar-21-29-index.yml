name: Galar 21-30 archive filename-structure verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galar-21-29-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  index-only:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify range safety tests before network access
        run: |
          python -m pip install pytest
          python -m pytest -q --noconftest tests/test_probe_galar_archive.py tests/test_summarize_galar_archive_layout.py
      - name: Download at most 8 MiB of official 7z index; never request medical pixels
        run: |
          python scripts/probe_galar_archive.py --destination /tmp/galar-21-29-index --sparse
      - name: Parse sparse archive metadata without decompressing image data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
          7z l -slt /tmp/galar-21-29-index/headers-only.7z > /tmp/galar-21-29-private-listing.txt
          python scripts/summarize_galar_archive_layout.py \
            --7z-listing /tmp/galar-21-29-private-listing.txt \
            --source-receipt /tmp/galar-21-29-index/receipt.json \
            --output /tmp/galar-21-29-index/layout.json
          rm -f /tmp/galar-21-29-private-listing.txt /tmp/galar-21-29-index/headers-only.7z
      - name: Save only verified aggregate index receipts; no image paths or pixels
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar-21-29-index-only
          path: |
            /tmp/galar-21-29-index/receipt.json
            /tmp/galar-21-29-index/layout.json
          retention-days: 30
          if-no-files-found: error