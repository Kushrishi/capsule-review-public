name: Frozen MobileNet research checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/GALAR_FROZEN_MOBILENET_CV_SPEC.json'
      - 'scripts/galar_frozen_mobilenet_cv.py'
      - 'scripts/verify_galar_frozen_mobilenet_cv.py'
      - 'tests/test_galar_frozen_mobilenet_cv.py'
      - 'tests/test_galar_frozen_mobilenet_cv_record.py'
      - '.github/workflows/galar-frozen-mobilenet.yml'
permissions:
  contents: read
jobs:
  synthetic-model-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install research-only numerical requirements
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3' 'torchvision>=0.24,<0.26'
          python -m pip install -e '.[dev]' 'scikit-learn>=1.5,<2'
      - name: Synthetic source-integrity, fold-separation and aggregate-regression tests
        run: python -m pytest -q tests/test_galar_frozen_mobilenet_cv.py tests/test_galar_frozen_mobilenet_cv_record.py
      - name: Static Python source syntax checks
        run: python -m py_compile scripts/galar_frozen_mobilenet_cv.py scripts/verify_galar_frozen_mobilenet_cv.py
