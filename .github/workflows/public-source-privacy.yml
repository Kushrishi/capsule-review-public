name: Public source privacy gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tracked-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject tracked source images, checkpoints, private archives and secrets
        run: python3 scripts/verify_public_source_boundary.py
