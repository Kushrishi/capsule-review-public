name: macOS desktop qualification
on:
  push:
    paths:
      - '.github/workflows/macos-desktop.yml'
      - 'src/capsule_review/desktop*.py'
      - 'src/capsule_review/app.py'
      - 'src/capsule_review/restricted_demo.py'
      - 'tests/test_restricted_demo.py'
      - 'src/capsule_review/importer.py'
      - 'src/capsule_review/store.py'
      - 'src/capsule_review/exporter.py'
      - 'src/capsule_review/full_span_evidence.py'
      - 'src/capsule_review/suggestion_evidence.py'
      - 'src/capsule_review/static/**'
      - 'tests/*desktop*'
      - 'tests/test_importer.py'
      - 'tests/test_api.py'
      - 'tests/test_detections.py'
      - 'tests/test_ai_review_export.py'
      - 'tests/test_saved_evidence.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/macos-desktop.yml'
      - 'src/capsule_review/desktop*.py'
      - 'src/capsule_review/app.py'
      - 'src/capsule_review/restricted_demo.py'
      - 'tests/test_restricted_demo.py'
      - 'src/capsule_review/importer.py'
      - 'src/capsule_review/store.py'
      - 'src/capsule_review/exporter.py'
      - 'src/capsule_review/full_span_evidence.py'
      - 'src/capsule_review/suggestion_evidence.py'
      - 'src/capsule_review/static/**'
      - 'tests/*desktop*'
      - 'tests/test_importer.py'
      - 'tests/test_api.py'
      - 'tests/test_detections.py'
      - 'tests/test_ai_review_export.py'
      - 'tests/test_saved_evidence.py'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Verify genuine macOS ARM64 environment
        run: |
          sw_vers
          uname -m
          python -c "import platform; assert platform.system() == 'Darwin'; assert platform.machine() == 'arm64'; print(platform.platform())"
      - name: Install desktop and test dependencies (no models)
        run: |
          python -m pip install -e '.[desktop,dev]'
          python -m pip check
          capsule-review-desktop --help
          python -c "import AppKit, WebKit; from capsule_review.desktop import default_data_dir; print(default_data_dir())"
      - name: Backend, authentication, persistence, importer and review tests
        timeout-minutes: 5
        run: >-
          python -m pytest -q -ra
          tests/test_desktop.py tests/test_desktop_close.py tests/test_desktop_folder_import.py tests/test_restricted_demo.py
          tests/test_importer.py tests/test_api.py tests/test_detections.py tests/test_ai_review_export.py tests/test_saved_evidence.py
      - name: Native Cocoa window and WebKit workflow (automated picker choices)
        timeout-minutes: 4
        run: python tests/macos_desktop_smoke.py
      - name: Native draft close, failed saves, timeout, conflict and discard
        timeout-minutes: 4
        run: |
          python tests/desktop_close_smoke.py
          python tests/desktop_close_smoke.py --discard
      - name: Native WebKit focus-aware keyboard input
        timeout-minutes: 2
        run: python tests/desktop_keyboard_smoke.py
      - name: Native generated restricted pixel control
        timeout-minutes: 2
        run: python tests/desktop_restricted_smoke.py
      - name: Native backend-failure shutdown
        timeout-minutes: 4
        run: python tests/macos_desktop_smoke.py --kill-backend
      - name: Public source privacy gate
        if: always()
        run: python scripts/verify_public_source_boundary.py
