[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-review"
version = "0.2.0"
description = "Local image-sequence review with annotations and illustrated exports."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.40,<1",
  "pillow>=12.1,<13",
  "python-multipart>=0.0.22,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "numpy>=2,<3"]
spatial = ["torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

desktop = [
  "pywebview>=6.2,<6.3",
  "platformdirs>=4,<5",
  "filelock>=3.20,<4",
  "QtPy>=2.4,<3; sys_platform == 'linux'",
  "PyQt6>=6.6,<7; sys_platform == 'linux'",
  "PyQt6-WebEngine>=6.6,<7; sys_platform == 'linux'",
]

[project.gui-scripts]
capsule-review-desktop = "capsule_review.desktop:main"

[project.scripts]
capsule-review = "capsule_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capsule_review = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
