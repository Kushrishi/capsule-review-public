[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-review"
version = "0.2.0"
description = "Local image-sequence review with annotations and illustrated exports."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.40,<1",
  "pillow>=12.1,<13",
  "python-multipart>=0.0.22,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "numpy>=2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[project.scripts]
capsule-review = "capsule_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capsule_review = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
