name: Galar 25 streamed original-image acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galar25-streamed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire-exam25:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only research dependencies and approved 7z decoder
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
      - name: Verify frozen spec and original source access guards before transfer
        run: |
          test "$(git hash-object docs/GALAR_25_TRANSFER_SPEC.json)" = "1e30c6bd31feb7e7dd4c7a41cca9513b8947bb7e"
          python -m pytest -q tests/test_probe_galar_archive.py tests/test_summarize_galar_archive_layout.py tests/test_plan_galar_fitting_images.py tests/test_acquire_galar_multiblock.py tests/test_acquire_galar_exam29.py tests/test_acquire_galar25_streamed.py
      - name: Download permitted official corrected labels only
        run: |
          python - <<'PY'
          from pathlib import Path
          from capsule_review.data_download import get_catalog, download_file
          metadata=get_catalog(Path('/tmp/galar25-official-catalog.json'))
          receipt=download_file(metadata,60383963,Path('/tmp/galar25-official-labels'),max_bytes=20_000_000)
          assert receipt['sha256']=='2f5ba84c47d343d51952e78bf22183b9d04ba8c105f625af3cf9ffb20412e52f'
          print('Official corrected Galar release verified; no reserved labels read')
          PY
      - name: Reproduce fitting-only frozen source-frame selection
        run: |
          python scripts/plan_galar_fitting_images.py \
            --labels-zip /tmp/galar25-official-labels/20251215_Labels_Updated.zip \
            --output-dir /tmp/galar25-private-selection --images-per-exam 512
          python - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('experiments/galar-21-30-selection/aggregate.json').read_text())
          current=json.loads(Path('/tmp/galar25-private-selection/aggregate.json').read_text())
          assert current==frozen
          assert current['per_examination']['25']['unique_requested_images']==1013
          assert current['per_examination']['25']['reference_positive_candidates']==14
          print('Frozen private source-frame selection reproduced exactly')
          PY
      - name: Stream verified blocks 2, 3 and 4 one at a time
        run: |
          python scripts/acquire_galar25_streamed.py \
            --layout experiments/galar-21-30-source-index/layout.json \
            --selection /tmp/galar25-private-selection/requested_frames.csv \
            --workdir /tmp/galar25-verified-stage \
            --package /tmp/galar25-verified-source.zip
      - name: Save only selected original PNGs and private verification receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar25-verified-original-frames-private
          path: |
            /tmp/galar25-verified-source.zip
            /tmp/galar25-verified-stage/aggregate-receipt.json
          retention-days: 30
          if-no-files-found: error
