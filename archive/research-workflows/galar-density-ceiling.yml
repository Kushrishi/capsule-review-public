name: Galar development-only annotation-density feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-density:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen protocol, code and protected-source access
        run: |
          test "$(git hash-object docs/GALAR_DENSITY_CEILING_SPEC.json)" = "25b920096f555ea9fc09ce3e69deaadb3bce23a2"
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_galar_density_ceiling.py tests/test_galar_reference_run_coverage.py tests/test_galar_run_coverage_record.py
      - name: Obtain only official corrected-label archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from capsule_review.data_download import get_catalog,download_file
          catalog=get_catalog(Path('/tmp/galar-density-article.json'))
          receipt=download_file(catalog,60383963,Path('/tmp/galar-density-source'),max_bytes=20_000_000)
          assert receipt['sha256']=='2f5ba84c47d343d51952e78bf22183b9d04ba8c105f625af3cf9ffb20412e52f'
          print('Verified original corrected label ZIP; no image bytes requested.')
          PY
      - name: Recompute all prespecified development-only candidate density ceilings
        run: |
          python scripts/galar_density_ceiling.py \
            --labels-zip /tmp/galar-density-source/20251215_Labels_Updated.zip \
            --spec docs/GALAR_DENSITY_CEILING_SPEC.json \
            --out /tmp/galar-density-output/aggregate.json
      - name: Keep original-source aggregate for independent replay
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar-density-aggregate-source-only
          path: /tmp/galar-density-output/aggregate.json
          retention-days: 30
          if-no-files-found: error
