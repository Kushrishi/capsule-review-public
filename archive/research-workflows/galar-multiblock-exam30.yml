name: Source-verified Galar exam30 acquisition after strict fixture correction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galar-multiblock-exam30-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire-verified-exam30:
    # Private source acquisition and artifacts must never execute in a public repository.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install research-only dependencies and exact 7z decoder
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
      - name: Run fail-closed two-block tests before network access
        run: |
          python -m pytest -q tests/test_probe_galar_archive.py tests/test_summarize_galar_archive_layout.py tests/test_plan_galar_fitting_images.py tests/test_acquire_galar_multiblock.py tests/test_verified_galar_acquisition.py
      - name: Download only official corrected labels and verify bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from capsule_review.data_download import get_catalog, download_file
          meta=get_catalog(Path('/tmp/galar-exam30-catalog.json'))
          report=download_file(meta,60383963,Path('/tmp/galar-exam30-labels'),max_bytes=20_000_000)
          assert report['sha256']=='2f5ba84c47d343d51952e78bf22183b9d04ba8c105f625af3cf9ffb20412e52f'
          print('Official corrected Galar annotation ZIP verified')
          PY
      - name: Reproduce frozen fitting sample without reserved-examination access
        run: |
          python scripts/plan_galar_fitting_images.py \
            --labels-zip /tmp/galar-exam30-labels/20251215_Labels_Updated.zip \
            --output-dir /tmp/galar-exam30-selection --images-per-exam 512
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/galar-exam30-selection/aggregate.json').read_text())
          frozen=json.loads(Path('experiments/galar-21-30-selection/aggregate.json').read_text())
          assert actual==frozen and actual['per_examination']['30']['unique_requested_images']==1006
          print('Exam30 frozen image selection reproduced exactly')
          PY
      - name: Acquire only blocks 8 and 9, extract and verify 1006 original PNGs
        run: |
          python scripts/acquire_galar_multiblock.py \
            --layout experiments/galar-21-30-source-index/layout.json \
            --selection /tmp/galar-exam30-selection/requested_frames.csv \
            --workdir /tmp/galar-exam30-stage \
            --package /tmp/galar-exam30-verified-source.zip
      - name: Upload original image data only as private expiring research artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galar-exam30-verified-frames-private
          path: |
            /tmp/galar-exam30-verified-source.zip
            /tmp/galar-exam30-stage/aggregate-receipt.json
          retention-days: 30
          if-no-files-found: error